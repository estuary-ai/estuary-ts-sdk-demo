# Not a workspace. pnpm 10+ keeps per-project SETTINGS in this file, so a
# single-package repo needs one too. This repo installs and deploys standalone
# (Vercel). The parent estuary-product pnpm workspace no longer exists — every
# repo here now installs the same way locally and on Vercel.

# Dependencies allowed to run install scripts. Without real true/false values
# here, pnpm's pre-run dependency check aborts every `pnpm dev` / `pnpm build`
# with ERR_PNPM_IGNORED_BUILDS before the script ever executes.
allowBuilds:
  '@tsparticles/engine': true
  sharp: true
  unrs-resolver: true

# @estuary-ai/sdk releases are our own package — exempt from the
# minimum-release-age supply-chain guard so fresh publishes install same-day.
# Bare package name (not name@version) so every future release stays exempt
# without editing this list on each publish.
# NOTE: pnpm invoked with --ignore-workspace skips this file entirely,
# INCLUDING these policy exclusions — never use that flag in this repo.
minimumReleaseAgeExclude:
  - '@estuary-ai/sdk'
